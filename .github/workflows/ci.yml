name: Build, test and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_call:
    inputs:
      platforms:
        type: string
        default: all
      source-root:
        type: string
        default: .
      library-name:
        type: string
        default: chargewire-odbc
      driver-name:
        type: string
        default: Chargewire ODBC Driver
      msi-name:
        type: string
        default: Chargewire-ODBC-Driver-x64.msi
      extra-suite:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to verify (tag publication always requires all platforms)
        type: choice
        default: all
        options: [all, unix, windows]
env:
  ODBC_SOURCE_ROOT: ${{ inputs.source-root || '.' }}
  ODBC_LIBRARY_NAME: ${{ inputs.library-name || 'chargewire-odbc' }}
  ODBC_DRIVER_NAME: ${{ inputs.driver-name || 'Chargewire ODBC Driver' }}
  ODBC_MSI_NAME: ${{ inputs.msi-name || 'Chargewire-ODBC-Driver-x64.msi' }}
  ODBC_EXTRA_SUITE: ${{ inputs.extra-suite || '' }}
permissions:
  contents: read
concurrency:
  group: ${{ inputs.platforms == 'unix' && format('odbc-unix-{0}', github.ref) || format('odbc-{0}', github.ref) }}
  cancel-in-progress: false
jobs:
  unix:
    if: inputs.platforms != 'windows'
    name: Test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: System dependencies
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            brew install ninja unixodbc openssl@3 rapidjson
            echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          else
            sudo apt-get update
            sudo apt-get install -y ninja-build unixodbc-dev libssl-dev rapidjson-dev
          fi
          python -m pip install pyodbc requests
      - uses: actions/cache/restore@v6
        id: deps
        with:
          path: .deps
          key: native-deps-v1-${{ github.event.repository.name }}-${{ matrix.platform }}-${{ hashFiles('**/scripts/build-arrow.py', '**/scripts/build-boost.py') }}
          restore-keys: native-deps-v1-${{ github.event.repository.name }}-${{ matrix.platform }}-
      - name: Static dependencies (Arrow IPC and compute, Boost)
        run: |
          python ${{ env.ODBC_SOURCE_ROOT }}/scripts/build-arrow.py --prefix .deps/install
          python ${{ env.ODBC_SOURCE_ROOT }}/scripts/build-boost.py --prefix .deps/install
      - uses: actions/cache/save@v6
        if: steps.deps.outputs.cache-hit != 'true'
        with:
          path: .deps
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/.deps/install" -DOPENSSL_USE_STATIC_LIBS=ON
          cmake --build build --parallel 3
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Download released Hardcharger server
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir server
          gh release download v2.3.0 --repo gizmodata/hardcharger --pattern 'hardcharger-${{ matrix.platform }}.tar.gz' --dir server
          tar -xzf server/*.tar.gz -C server
          echo "SERVER=$(find "$PWD/server" -type f -name hardcharger-server | head -1)" >> "$GITHUB_ENV"
      - name: C and Python live suites (plain HTTP and verified TLS)
        shell: bash
        run: |
          driver=$(find "$PWD/build" -name 'lib${{ env.ODBC_LIBRARY_NAME }}.*' -type f | head -1)
          python ${{ env.ODBC_SOURCE_ROOT }}/scripts/test-live.py --suite-root "${{ env.ODBC_SOURCE_ROOT }}" --driver-name "${{ env.ODBC_DRIVER_NAME }}" --extra-suite "${{ env.ODBC_EXTRA_SUITE }}" --server "$SERVER" --driver "$driver"
      - name: Package tested library
        shell: bash
        run: |
          python ${{ env.ODBC_SOURCE_ROOT }}/scripts/third-party-notices.py
          mkdir -p package/lib package/share/${{ env.ODBC_LIBRARY_NAME }}
          cp build/Release/lib/lib${{ env.ODBC_LIBRARY_NAME }}.* package/lib/
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.txt package/share/${{ env.ODBC_LIBRARY_NAME }}/
          if [[ "$RUNNER_OS" == macOS ]]; then
            otool -L package/lib/*
          else
            ldd package/lib/*
          fi
          tar -czf ${{ env.ODBC_LIBRARY_NAME }}-${{ matrix.platform }}.tar.gz -C package .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ODBC_LIBRARY_NAME }}-${{ matrix.platform }}
          path: ${{ env.ODBC_LIBRARY_NAME }}-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs-${{ matrix.platform }}
          path: live-*.log

  windows:
    if: inputs.platforms != 'unix'
    name: Test (windows-amd64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 5d4a3dc90c0b3773f3bac81bf41297b54328f471
          path: .deps/vcpkg
      - uses: actions/cache/restore@v6
        id: deps
        with:
          path: |
            .deps/arrow-build
            .deps/arrow-apache-arrow-26.0.0
            .deps/install
            vcpkg_installed
            ~/AppData/Local/vcpkg/archives
          key: native-deps-v1-${{ github.event.repository.name }}-windows-amd64-${{ hashFiles('**/vcpkg.json', '**/scripts/build-arrow.py') }}
          restore-keys: native-deps-v1-${{ github.event.repository.name }}-windows-amd64-
      - name: Native dependencies
        shell: pwsh
        run: |
          .deps/vcpkg/bootstrap-vcpkg.bat -disableMetrics
          .deps/vcpkg/vcpkg.exe install --triplet x64-windows-static-md "--x-manifest-root=$pwd/${{ env.ODBC_SOURCE_ROOT }}" "--x-install-root=$pwd/vcpkg_installed"
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg failed' }
          python ${{ env.ODBC_SOURCE_ROOT }}/scripts/build-arrow.py --prefix .deps/install --toolchain "$pwd/.deps/vcpkg/scripts/buildsystems/vcpkg.cmake"
          if ($LASTEXITCODE -ne 0) { throw 'Arrow build failed' }
          python -m pip install pyodbc requests
      - uses: actions/cache/save@v6
        if: steps.deps.outputs.cache-hit != 'true'
        with:
          path: |
            .deps/arrow-build
            .deps/arrow-apache-arrow-26.0.0
            .deps/install
            vcpkg_installed
            ~/AppData/Local/vcpkg/archives
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - name: Build
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$pwd/.deps/install" "-DCMAKE_TOOLCHAIN_FILE=$pwd/.deps/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static-md "-DVCPKG_MANIFEST_DIR=$pwd/${{ env.ODBC_SOURCE_ROOT }}" "-DVCPKG_INSTALLED_DIR=$pwd/vcpkg_installed"
          if ($LASTEXITCODE -ne 0) { throw 'configure failed' }
          cmake --build build --parallel 3
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Download released Hardcharger server and register test driver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.3.0 --repo gizmodata/hardcharger --pattern hardcharger-windows-amd64.zip --dir server
          Expand-Archive server/*.zip server/unpacked
          $server = (Get-ChildItem server/unpacked -Recurse -Filter hardcharger-server.exe | Select-Object -First 1).FullName
          "SERVER=$server" >> $env:GITHUB_ENV
          $path = "$pwd/build/Release/lib/${{ env.ODBC_LIBRARY_NAME }}.dll"
          $key = 'HKLM:\SOFTWARE\ODBC\ODBCINST.INI\${{ env.ODBC_DRIVER_NAME }}'
          New-Item -Force $key
          Set-ItemProperty $key Driver $path
          Set-ItemProperty $key Setup $path
          New-Item -Force 'HKLM:\SOFTWARE\ODBC\ODBCINST.INI\ODBC Drivers'
          Set-ItemProperty 'HKLM:\SOFTWARE\ODBC\ODBCINST.INI\ODBC Drivers' '${{ env.ODBC_DRIVER_NAME }}' 'Installed'
      - name: C and Python live suites (plain HTTP and verified TLS)
        shell: pwsh
        run: python ${{ env.ODBC_SOURCE_ROOT }}/scripts/test-live.py --suite-root "${{ env.ODBC_SOURCE_ROOT }}" --driver-name "${{ env.ODBC_DRIVER_NAME }}" --extra-suite "${{ env.ODBC_EXTRA_SUITE }}" --server "$env:SERVER" --driver build/Release/lib/${{ env.ODBC_LIBRARY_NAME }}.dll
      - name: Package unsigned files for signing
        shell: pwsh
        run: |
          python ${{ env.ODBC_SOURCE_ROOT }}/scripts/third-party-notices.py
          New-Item -ItemType Directory -Force unsigned
          Copy-Item THIRD_PARTY_NOTICES.txt unsigned/
          Copy-Item build/Release/lib/${{ env.ODBC_LIBRARY_NAME }}.dll unsigned/
          $crt = Join-Path $env:VCToolsRedistDir 'x64/Microsoft.VC143.CRT'
          Copy-Item "$crt/vcruntime140.dll","$crt/vcruntime140_1.dll","$crt/msvcp140.dll","$crt/msvcp140_codecvt_ids.dll" unsigned/
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-amd64
          path: unsigned/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs-windows-amd64
          path: live-*.log

  sign-windows:
    name: Sign and verify Windows DLL and MSI
    needs: [unix, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-windows-amd64
          path: installer/bin
      - uses: azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Signing and installer tools
        run: |
          dotnet tool install --global AzureSignTool --version 7.0.1
          dotnet tool install --global wix --version 6.0.2
          wix extension add WixToolset.UI.wixext/6.0.2
      - name: Sign DLL, build MSI, sign MSI
        shell: pwsh
        env:
          KEY_VAULT_URI: ${{ secrets.AZURE_KEY_VAULT_URI }}
          CERT_NAME: ${{ secrets.AZURE_CERT_NAME }}
        run: |
          # Prove that signature verification refuses the unsigned build.
          pwsh -File ${{ env.ODBC_SOURCE_ROOT }}/.github/scripts/verify-windows-signature.ps1 installer/bin/${{ env.ODBC_LIBRARY_NAME }}.dll *> unsigned-proof.log
          if ($LASTEXITCODE -eq 0 -or -not (Select-String -Quiet -SimpleMatch 'signature status NotSigned' unsigned-proof.log)) {
            Get-Content unsigned-proof.log
            throw 'signature check failed its negative control'
          }
          pwsh -File ${{ env.ODBC_SOURCE_ROOT }}/.github/scripts/azure-sign.ps1 installer/bin/${{ env.ODBC_LIBRARY_NAME }}.dll
          if ($LASTEXITCODE -ne 0) { throw 'DLL signing failed' }
          Copy-Item installer/bin/THIRD_PARTY_NOTICES.txt installer/THIRD_PARTY_NOTICES.txt
          python ${{ env.ODBC_SOURCE_ROOT }}/scripts/installer-assets.py
          wix build installer/Driver.wxs -arch x64 -b "BinDir=$pwd/installer/bin" -b "$pwd/installer" -o ${{ env.ODBC_MSI_NAME }} -ext WixToolset.UI.wixext
          if ($LASTEXITCODE -ne 0) { throw 'MSI build failed' }
          pwsh -File ${{ env.ODBC_SOURCE_ROOT }}/.github/scripts/azure-sign.ps1 ${{ env.ODBC_MSI_NAME }}
          if ($LASTEXITCODE -ne 0) { throw 'MSI signing failed' }
          pwsh -File ${{ env.ODBC_SOURCE_ROOT }}/.github/scripts/verify-windows-signature.ps1 installer/bin/${{ env.ODBC_LIBRARY_NAME }}.dll ${{ env.ODBC_MSI_NAME }} | Tee-Object signature-verification.txt
          if ($LASTEXITCODE -ne 0) { throw 'signature verification failed' }
          # Install the signed MSI and load the installed driver through the ODBC manager.
          $p = Start-Process msiexec.exe -ArgumentList '/i', '${{ env.ODBC_MSI_NAME }}', '/qn', '/l*v', 'msi-install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "MSI install failed: $($p.ExitCode)" }
          python -m pip install pyodbc
          python -c "import pyodbc; assert '${{ env.ODBC_DRIVER_NAME }}' in pyodbc.drivers(), pyodbc.drivers()"
          New-Item -ItemType Directory -Force release
          Copy-Item installer/bin/${{ env.ODBC_LIBRARY_NAME }}.dll release/${{ env.ODBC_LIBRARY_NAME }}-windows-amd64.dll
          Copy-Item ${{ env.ODBC_MSI_NAME }} release/
          Copy-Item signature-verification.txt release/
          Compress-Archive -Path installer/bin/*,LICENSE,NOTICE -DestinationPath release/${{ env.ODBC_LIBRARY_NAME }}-windows-amd64.zip
      - name: Test installed signed driver (HTTP and TLS)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install requests
          gh release download v2.3.0 --repo gizmodata/hardcharger --pattern hardcharger-windows-amd64.zip --dir server
          Expand-Archive server/*.zip server/unpacked
          $server = (Get-ChildItem server/unpacked -Recurse -Filter hardcharger-server.exe | Select-Object -First 1).FullName
          python ${{ env.ODBC_SOURCE_ROOT }}/scripts/test-live.py --suite-root "${{ env.ODBC_SOURCE_ROOT }}" --driver-name "${{ env.ODBC_DRIVER_NAME }}" --extra-suite "${{ env.ODBC_EXTRA_SUITE }}" --python-only --server "$server" --driver "$env:ProgramFiles/${{ env.ODBC_DRIVER_NAME }}/${{ env.ODBC_LIBRARY_NAME }}.dll"
          if ($LASTEXITCODE -ne 0) { throw 'signed driver live tests failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: signed-windows-amd64
          path: release/*
          if-no-files-found: error

  release:
    needs: [unix, windows, sign-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Require the wrapper's core to be a published release
        if: env.ODBC_SOURCE_ROOT != '.'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          core="${{ env.ODBC_SOURCE_ROOT }}"
          # Submodules are tree entries, so read the pinned source explicitly.
          git submodule update --init "$core"
          version=$(sed -n 's/project([^ ]* VERSION \([^ ]*\).*/\1/p' "$core/CMakeLists.txt")
          test "$(gh release view "v$version" --repo gizmodata/chargewire-odbc --json isDraft --jq '.isDraft == false')" = true
          released=$(gh api "repos/gizmodata/chargewire-odbc/commits/v$version" --jq .sha)  # the commit, for annotated and lightweight tags alike
          test "$released" = "$(git rev-parse "HEAD:$core")"
      - name: Assemble tested, signed release
        shell: bash
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(sed -n 's/project([^ ]* VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)"
          mkdir release
          cp artifacts/${{ env.ODBC_LIBRARY_NAME }}-*/*.tar.gz release/
          cp artifacts/signed-windows-amd64/* release/
          cp LICENSE NOTICE README.md release/
          (cd release && sha256sum ./* > SHA256SUMS)
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "${{ env.ODBC_DRIVER_NAME }} $GITHUB_REF_NAME" --notes-file docs/release-notes.md release/*
